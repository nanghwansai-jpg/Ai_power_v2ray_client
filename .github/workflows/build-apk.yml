name: Build Android APK and AAB Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android Release APK & Bundle (AAB)
        working-directory: ./android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-V2Ray-Client-APK
          path: android-project/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-V2Ray-Client-AAB
          path: android-project/app/build/outputs/bundle/**/*.aab
          retention-days: 30
