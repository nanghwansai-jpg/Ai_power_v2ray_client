name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the removed legacy `tools` package.
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Go from pinned libXray module
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pinned XTLS/libXray Android AAR
        env:
          LIBXRAY_VERSION: v26.11.9
          LIBXRAY_WORKDIR: ${{ runner.temp }}/libXray
        run: bash scripts/build-libxray-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug APK
        run: gradle :android:app:testDebugUnitTest :android:app:assembleDebug
 
      - name: Build release variant and inspect DEX for test-only fault injection
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release-inspection.keystore" \
            -storepass ci-inspection-store-password \
            -keypass ci-inspection-key-password \
            -alias ci-inspection \
            -dname "CN=CI Release Inspection" \
            -keyalg RSA -keysize 2048 -validity 2
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ci-release-inspection.keystore" \
          ANDROID_KEYSTORE_PASSWORD="ci-inspection-store-password" \
          ANDROID_KEY_ALIAS="ci-inspection" \
          ANDROID_KEY_PASSWORD="ci-inspection-key-password" \
            gradle :android:app:assembleRelease
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          if unzip -Z1 "$APK" | grep -E '^classes[0-9]*\\.dex
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-power-v2ray-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native V4 build provenance
        uses: actions/upload-artifact@v4
        with:
          name: libxray-v4-build-provenance
          path: ${{ runner.temp }}/libXray/native-v4-build.txt
          if-no-files-found: error
          retention-days: 90
 | while read -r dex; do unzip -p "$APK" "$dex"; done | strings | grep -F 'AI_POWER_V4_FAULT_INJECTION_TEST_ONLY' >/dev/null; then
            echo "::error::Test-only native V4 fault injection marker found in release APK"
            exit 1
          fi
          echo "Verified: test-only fault injection code is absent from release APK DEX."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-power-v2ray-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native V4 build provenance
        uses: actions/upload-artifact@v4
        with:
          name: libxray-v4-build-provenance
          path: ${{ runner.temp }}/libXray/native-v4-build.txt
          if-no-files-found: error
          retention-days: 90
